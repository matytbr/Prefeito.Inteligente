*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}

p{margin:0 0 12px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{flex:1 1 90px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.chip b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.chip span{font-size:.8rem;color:var(--mut)}
.sky{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 8px 4px;margin-bottom:14px}
.sky svg{width:100%;height:auto;display:block}

.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:99px;margin-bottom:8px;color:#14303A}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--bg)}
.opt:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.opt strong{display:block}
.opt small{color:var(--mut)}
.btn{font:700 1rem "DM Sans",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
:focus-visible{outline:3px solid var(--seg);outline-offset:2px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.fx span{font-weight:700;font-size:.85rem;border:2px solid var(--line);border-radius:8px;padding:2px 8px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.verdict{font-weight:700}
.bar{height:6px;background:var(--line);border-radius:4px;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
@media (prefers-reduced-motion:reduce){.sky rect.b{transition:none}}

/* Edição Evoluída: interface responsiva, painel de dados e acessibilidade */

:5px;font-size:.86rem}.opt .option-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mini-pill{display:inline-flex;border-radius:999px;padding:3px 8px;background:var(--bg);color:var(--mut);font-size:.76rem;font-weight:700}.btn{border-radius:12px;padding:12px 17px;background:var(--accent);color:white}.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#a33b2a;color:white}.bar{height:8px;border-radius:99px;overflow:hidden;background:var(--line)}.bar i{background:var(--accent);transition:width .3s}.progress-label{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mut);margin-bottom:6px}.stat-list{display:grid;gap:12px}.stat-row{display:grid;grid-template-columns:112px 1fr 35px;gap:8px;align-items:center;font-size:.82rem}.stat-track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.stat-fill{height:100%;border-radius:99px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.section-head p{color:var(--mut);font-size:.88rem}.event-card{border:1px solid #e6b75a;background:linear-gradient(135deg,rgba(242,183,5,.13),transparent),var(--card)}.event-label{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a76a00}.feedback-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.feedback-stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.feedback-stat b{display:block;font-size:1.1rem}.history-list{display:grid;gap:8px}.history-item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}.history-icon{width:32px;height:32px;display:grid;place-items:center;background:var(--bg);border-radius:10px}.history-item small{display:block;color:var(--mut)}.intro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.intro-feature{padding:13px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}.intro-feature b{display:block;margin:5px 0}.intro-feature span{font-size:.84rem;color:var(--mut)}.result-hero{padding:20px;border-radius:18px;background:linear-gradient(130deg,rgba(46,158,91,.16),rgba(91,79,207,.08)),var(--card);border:1px solid var(--line);margin-bottom:12px}.result-hero h2{font-size:clamp(1.5rem,5vw,2.3rem)}.result-score{font-size:2.2rem;font-weight:800;letter-spacing:-.04em}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.notice{padding:11px 13px;border-radius:12px;background:var(--bg);color:var(--mut);font-size:.86rem}.empty{color:var(--mut);padding:12px 0}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small-note{font-size:.78rem;color:var(--mut)}
@media(max-width:680px){.dashboard{grid-template-columns:1fr}.hero-mark{display:none}.intro-grid{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr}.stat-row{grid-template-columns:100px 1fr 30px}.top{gap:7px}.chip{padding:10px}.feedback-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

function resumeGame(){try{var d=JSON.parse(localStorage.getItem('pi-save'));if(!d||!d.st||!d.S)return intro();M=d.M;V=d.V;S=d.S;st=d.st;if(st.r>=S.length)end();else show()}catch(e){intro()}}
